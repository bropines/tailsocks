# Unit tests and preview fixtures are full of made-up keys ("tskey-api-kA-x"):
# the code under test parses, masks and sorts them. None is a credential, and
# every one of them raised an alert.
paths-ignore:
  - "app/src/test/**"
  - "app/src/screenshotTest/**"
  - "appctr/**/*_test.go"
  - "appctr/testdata/**"
