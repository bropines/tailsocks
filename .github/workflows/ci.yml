name: CI

# Every push to main and every pull request against it: gofmt and the Go
# tests, then a debug APK with the JVM unit tests and the NewApi lint. Releases
# are android.yml's, on a tag — which runs the same tests before it publishes.
#
# One ABI is enough to prove that the core builds and that the app compiles
# against the bridge; the release builds all four. Nothing here is signed or
# published, and nothing here can reach a release APK: a tag builds from a
# clean checkout, and the caches this workflow fills hold downloads and
# content-addressed compiler output, never a build's result.
#
# Not here: the Compose preview screenshot tests. Their reference images are
# not committed, so there is nothing to validate against; render them locally
# (docs/BUILDING.md).

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'fastlane/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/DISCUSSION_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/workflows/repo-to-llm.yml'
      - '.github/workflows/repomix-context.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'fastlane/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/DISCUSSION_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/workflows/repo-to-llm.yml'
      - '.github/workflows/repomix-context.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Go tests, debug APK, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # hev-socks5-tunnel and its lwIP, hev-task-system

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      # The same key as android.yml's, so the release build on a tag restores
      # what this job saves: a tag can read only its own caches and the default
      # branch's, and a cache saved by a tag is read by nobody. Saved below, from
      # main only, and only when the key is new.
      - name: Restore the Go caches
        id: go-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('appctr/go.sum', 'appctr/TAILSCALE_VERSION', 'appctr/patches/*.patch') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # Before build.sh, which runs gofmt -w itself and would hide the problem.
      - name: Verify Go code formatting
        run: |
          cd appctr
          UNFORMATTED=$(gofmt -l $(find . -name "*.go" -not -path "./tailscale_src/*" -not -path "./orig/*" -not -path "./tmp/*"))
          if [ -n "$UNFORMATTED" ]; then
            echo "The following Go files need formatting:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Install the NDK
        run: |
          NDK_VER=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' app/build.gradle.kts)
          SDK=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          if [ ! -x "$SDK/ndk/$NDK_VER/ndk-build" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VER" > /dev/null
          fi
          echo "ANDROID_NDK_HOME=$SDK/ndk/$NDK_VER" >> "$GITHUB_ENV"

      # The Go of appctr/go.mod and the gomobile of its x/mobile, as the release
      # build uses (android.yml). It also leaves appctr/tailscale_src patched,
      # which the Go tests below compile against.
      - name: Build the native core (arm64-v8a)
        env:
          TS_ABIS: arm64-v8a
        run: |
          cd appctr
          export GOTOOLCHAIN=go$(awk '$1 == "go" { print $2 }' go.mod)
          MOBILE_VER=$(awk '$1 == "golang.org/x/mobile" { print $2 }' go.mod)
          go install golang.org/x/mobile/cmd/gomobile@"$MOBILE_VER"
          go install golang.org/x/mobile/cmd/gobind@"$MOBILE_VER"
          bash build.sh

      # The bridge's own tests (the live ones skip without their binaries),
      # then the patched Tailscale packages that test in seconds.
      - name: Go tests
        run: bash .github/workflows/go-tests.sh appctr

      - name: Save the Go caches
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # Writes Gradle's caches from main only (the action's default) and reads
      # them everywhere, the release workflow's tags included.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # -PlintNewApiOnly fails on nothing but a call above minSdk
      # (app/build.gradle.kts); a debug build has no lintVital pass to do it.
      - name: Assemble debug, unit tests and lint (NewApi)
        run: ./gradlew app:assembleDebug app:testDebugUnitTest app:lintDebug -PlintNewApiOnly -PtargetAbi=arm64-v8a --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      # The Open-source licenses screen lists what ships (scripts/licenses/generate.py).
      # A dependency that changed without a regenerated list is flagged, not fatal.
      - name: Check the license list
        run: |
          python3 scripts/licenses/generate.py --check || echo "::warning::app/src/main/assets/licenses.json no longer matches what ships: run scripts/licenses/generate.py"

      - name: Name the debug APK
        run: |
          BASE_VER=$(sed -n 's/^VERSION_NAME=//p' version.properties)
          mkdir -p out
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk \
            "out/TailSocks-v${BASE_VER}-arm64-v8a-$(git rev-parse --short=6 HEAD)-dev.apk"

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tailsocks-arm64-v8a-dev
          path: out/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload the test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
