name: Android CI Chain

# Releases only: a tag builds, signs and publishes. A push to main or a pull
# request no longer spends a full Go and Gradle build each — the tag that
# follows them builds the same tree anyway. Anything in between is a manual run.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release/all)'
        required: true
        default: 'release'
        type: choice
        options: [ 'debug', 'release', 'all' ]

# Least privilege: the compile jobs only read the repo. Write to contents is
# granted per-job, to the release job alone (it creates the GitHub release).
permissions:
  contents: read

jobs:
  build-go:
    name: Build Go Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      # One Go cache, keyed by what changes the bulk of it — modules, the
      # Tailscale version, the patches — not by the commit. Saved per commit
      # (2.5 GB a time) and again by setup-go's own cache (3.8 GB), it filled
      # the repository's 10 GB and pushed Gradle's cache out before every run.
      # The Go toolchain the build switches to lives in the module cache too.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Go caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('appctr/go.sum', 'appctr/TAILSCALE_VERSION', 'appctr/patches/*.patch') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Verify Go Code Formatting
        run: |
          cd appctr
          UNFORMATTED=$(gofmt -l $(find . -name "*.go" -not -path "./tailscale_src/*" -not -path "./orig/*" -not -path "./tmp/*"))
          if [ -n "$UNFORMATTED" ]; then
            echo "The following Go files need formatting:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Build AppCtr Core
        run: |
          # Built where F-Droid builds, /home/vagrant/build/<applicationId>:
          # gomobile writes the absolute path of the module it binds into
          # libgojni.so (a replace directive in its own go.mod, which -trimpath
          # does not reach), and F-Droid ships our APK only if its rebuild of
          # the release matches it byte for byte. Everything else in the APK
          # was checked not to depend on the path.
          BUILD_DIR=/home/vagrant/build/io.github.bropines.tailscaled
          # The NDK app/build.gradle.kts pins, for cgo and the external linker
          # too. The runner exports ANDROID_NDK_HOME for its own default NDK
          # (r27, clang 18), and the core used to be built with that: the
          # first comparison with F-Droid's build (r28c, clang 19) differed in
          # exactly the three Go libraries.
          NDK_VER=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' app/build.gradle.kts)
          SDK=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          if [ ! -x "$SDK/ndk/$NDK_VER/ndk-build" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VER" > /dev/null
          fi
          export ANDROID_NDK_HOME="$SDK/ndk/$NDK_VER"
          sudo mkdir -p /home/vagrant/build
          sudo chown -R "$(id -u):$(id -g)" /home/vagrant
          cp -a "$GITHUB_WORKSPACE" "$BUILD_DIR"
          cd "$BUILD_DIR/appctr"
          # Exactly the Go of appctr/go.mod, as F-Droid's build uses (its srclib,
          # GOTOOLCHAIN=local): "auto" would also switch a command to the newest
          # patch release whenever a dependency asks for more, and the release
          # must come out of the same compiler to be reproduced.
          export GOTOOLCHAIN=go$(awk '$1 == "go" { print $2 }' go.mod)
          # Pinned to the x/mobile version appctr/go.mod requires, so a new
          # upstream gomobile cannot change the bridge between two builds.
          MOBILE_VER=$(awk '$1 == "golang.org/x/mobile" { print $2 }' go.mod)
          go install golang.org/x/mobile/cmd/gomobile@"$MOBILE_VER"
          go install golang.org/x/mobile/cmd/gobind@"$MOBILE_VER"
          bash build.sh
          # Back into the workspace, where the upload step looks.
          mkdir -p "$GITHUB_WORKSPACE/appctr/tmp" "$GITHUB_WORKSPACE/app/src/main/jniLibs"
          cp "$BUILD_DIR/appctr/tmp/appctr.aar" "$GITHUB_WORKSPACE/appctr/tmp/"
          cp -a "$BUILD_DIR/app/src/main/jniLibs/." "$GITHUB_WORKSPACE/app/src/main/jniLibs/"

      - name: Upload Go Core Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-core-artifacts
          path: |
            app/src/main/jniLibs/
            appctr/tmp/appctr.aar

  build-apk:
    name: Build Android APK
    needs: [build-go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # The app's version is version.properties, not the tag; a release whose
      # tag says one version and whose APK another would confuse every updater,
      # F-Droid's first. The code must also follow the name's scheme.
      - name: Check the tag against version.properties
        if: github.ref_type == 'tag'
        run: |
          name=$(sed -n 's/^VERSION_NAME=//p' version.properties)
          code=$(sed -n 's/^VERSION_CODE=//p' version.properties)
          if [ "${{ github.ref_name }}" != "v$name" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match VERSION_NAME=$name in version.properties"
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$name"
          if [ "$code" != "$((major * 1000000 + minor * 10000 + patch * 100))" ]; then
            echo "::error::VERSION_CODE=$code does not follow VERSION_NAME=$name (major*1000000 + minor*10000 + patch*100)"
            exit 1
          fi

      - name: Download Go Core Artifacts
        uses: actions/download-artifact@v4
        with:
          name: go-core-artifacts
          path: .

      # The C libraries (hev-socks5-tunnel, ByeDPI) are built by Gradle's
      # ndkBuild, as F-Droid builds them — with -ffile-prefix-map, so the
      # APK does not depend on where the checkout is. A separate ndk-build
      # without it used to make them here. The NDK is the one ndkVersion pins.
      - name: Install the NDK
        run: |
          NDK_VER=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' app/build.gradle.kts)
          SDK=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          if [ ! -x "$SDK/ndk/$NDK_VER/ndk-build" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VER" > /dev/null
          fi

      # 21, as on F-Droid's buildserver (Debian trixie); the bytecode is Java 17's
      # from either (app/build.gradle.kts), so the APK is the same byte for byte.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          # No cache here: setup-gradle below caches Gradle's home itself.

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore
        if: github.ref_type == 'tag' || github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'all' || github.event_name == 'push'
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.jks
          if [ ! -s app/release.jks ]; then
            echo "KEYSTORE_BASE64 secret is empty; cannot sign a release." >&2
            exit 1
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Determine Gradle command
        id: gradle_command
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            echo "command=app:assembleRelease" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            # No signing secrets on PRs; a release build would fail the keystore
            # guard. Debug only.
            echo "command=app:assembleDebug" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" == "push" ]; then
            echo "command=app:assembleDebug app:assembleRelease" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.inputs.build_type }}" in
              "debug") echo "command=app:assembleDebug" >> "$GITHUB_OUTPUT";;
              "release") echo "command=app:assembleRelease" >> "$GITHUB_OUTPUT";;
              "all") echo "command=app:assembleDebug app:assembleRelease" >> "$GITHUB_OUTPUT";;
              *) echo "command=app:assembleDebug app:assembleRelease" >> "$GITHUB_OUTPUT";;
            esac
          fi

      - name: Check API levels (lint, NewApi only)
        run: |
          chmod +x gradlew
          ./gradlew app:lintDebug -PlintNewApiOnly --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew ${{ steps.gradle_command.outputs.command }} --stacktrace
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_HOME: /usr/local/lib/android/sdk

      # The Open-source licenses screen lists what ships (scripts/licenses/generate.py).
      # A dependency that changed without a regenerated list is flagged, not fatal.
      - name: Check the license list
        run: |
          python3 scripts/licenses/generate.py --check || echo "::warning::app/src/main/assets/licenses.json no longer matches what ships: run scripts/licenses/generate.py"

      - name: Prepare APKs for upload
        run: |
          mkdir -p apks-separated
          GIT_HASH=$(git rev-parse --short=6 HEAD)
          BASE_VER=$(sed -n 's/^VERSION_NAME=//p' version.properties)
          
          find app/build/outputs/apk -name "*.apk" -not -name "*unaligned*" | while read -r apk_file; do
            filename=$(basename "$apk_file")
            if echo "$apk_file" | grep -q "debug"; then
              type="dev"
            else
              type="release"
            fi
            
            if echo "$filename" | grep -q "arm64-v8a"; then
              abi="arm64-v8a"
            elif echo "$filename" | grep -q "armeabi-v7a"; then
              abi="armeabi-v7a"
            elif echo "$filename" | grep -q "x86_64"; then
              abi="x86_64"
            elif echo "$filename" | grep -q "x86"; then
              abi="x86"
            elif echo "$filename" | grep -q "universal"; then
              abi="universal"
            else
              abi="apk"
            fi
            
            out_dir="apks-separated/${abi}-${type}"
            mkdir -p "$out_dir"
            
            # A release keeps a name F-Droid can predict from the version alone
            # (its Binaries: pattern knows only %v); builds between releases
            # carry the commit, since several of them share a version.
            if [ "$type" == "dev" ]; then
              cp "$apk_file" "$out_dir/TailSocks-v${BASE_VER}-${abi}-${GIT_HASH}-dev.apk"
            elif [ "${{ github.ref_type }}" == "tag" ]; then
              cp "$apk_file" "$out_dir/TailSocks-v${BASE_VER}-${abi}-release.apk"
            else
              cp "$apk_file" "$out_dir/TailSocks-v${BASE_VER}-${abi}-${GIT_HASH}-release.apk"
            fi
          done

      - name: Upload arm64-v8a Dev APK
        if: hashFiles('apks-separated/arm64-v8a-dev/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tailsocks-arm64-v8a-dev
          path: apks-separated/arm64-v8a-dev/*.apk

      - name: Upload arm64-v8a Release APK
        if: hashFiles('apks-separated/arm64-v8a-release/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tailsocks-arm64-v8a-release
          path: apks-separated/arm64-v8a-release/*.apk

      - name: Upload armeabi-v7a Dev APK
        if: hashFiles('apks-separated/armeabi-v7a-dev/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tailsocks-armeabi-v7a-dev
          path: apks-separated/armeabi-v7a-dev/*.apk

      - name: Upload armeabi-v7a Release APK
        if: hashFiles('apks-separated/armeabi-v7a-release/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tailsocks-armeabi-v7a-release
          path: apks-separated/armeabi-v7a-release/*.apk

      - name: Upload Universal Dev APK
        if: hashFiles('apks-separated/universal-dev/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tailsocks-universal-dev
          path: apks-separated/universal-dev/*.apk

      - name: Upload Universal Release APK
        if: hashFiles('apks-separated/universal-release/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tailsocks-universal-release
          path: apks-separated/universal-release/*.apk

      - name: Upload x86 Dev APK
        if: hashFiles('apks-separated/x86-dev/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tailsocks-x86-dev
          path: apks-separated/x86-dev/*.apk

      - name: Upload x86 Release APK
        if: hashFiles('apks-separated/x86-release/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tailsocks-x86-release
          path: apks-separated/x86-release/*.apk

      - name: Upload x86_64 Dev APK
        if: hashFiles('apks-separated/x86_64-dev/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tailsocks-x86_64-dev
          path: apks-separated/x86_64-dev/*.apk

      - name: Upload x86_64 Release APK
        if: hashFiles('apks-separated/x86_64-release/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tailsocks-x86_64-release
          path: apks-separated/x86_64-release/*.apk

  release:
    name: Create Release
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Only this job publishes the GitHub release, so it alone needs write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All APKs
        uses: actions/download-artifact@v4
        with:
          pattern: tailsocks-*
          path: release-artifacts
          merge-multiple: true

      - name: Extract Release Notes from CHANGELOG
        id: changelog_reader
        run: |
          python3 -c "
          import re, os
          tag = os.environ.get('TAG_NAME', '')
          version = tag.lstrip('v')
          body = ''
          if os.path.exists('CHANGELOG.md'):
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              pattern = rf'(?s)(##\s*\[{re.escape(version)}\].*?)(?=\n##\s*\[|\Z)'
              match = re.search(pattern, content)
              if match:
                  section = match.group(1).strip()
                  lines = section.splitlines()
                  body = '\n'.join(lines[1:]).strip() if len(lines) > 1 else ''
          with open('release_notes.txt', 'w', encoding='utf-8') as out:
              out.write(body)
          "
        env:
          TAG_NAME: ${{ github.ref_name }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*.apk
          body_path: release_notes.txt
          tag_name: ${{ github.ref_name }}
          name: "TailSocks ${{ github.ref_name }}"
