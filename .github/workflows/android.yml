name: Android CI Chain

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths:
      - 'app/**'
      - 'appctr/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'appctr/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release/all)'
        required: true
        default: 'release'
        type: choice
        options: [ 'debug', 'release', 'all' ]

permissions:
  contents: write

jobs:
  build-core:
    name: Build Go Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: appctr/go.sum

      - name: Build AppCtr Core
        run: |
          cd appctr
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          sh build.sh

      - name: Upload Core Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-artifacts
          path: |
            app/src/main/jniLibs/
            appctr/tmp/appctr.aar

  build-apk:
    name: Build Android APK
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Core Artifacts
        uses: actions/download-artifact@v4
        with:
          name: core-artifacts
          path: .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Decode Keystore
        if: github.ref_type == 'tag' || github.event.inputs.build_type == 'release' || github.event_name == 'push'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Determine Gradle command
        id: gradle_command
        run: |
          if [ "${{ github.event_name }}" == "push" ] || [ "${{ github.ref_type }}" == "tag" ]; then
            echo "command=app:assembleRelease" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.inputs.build_type }}" in
              "debug") echo "command=app:assembleDebug" >> "$GITHUB_OUTPUT";;
              "release") echo "command=app:assembleRelease" >> "$GITHUB_OUTPUT";;
              "all") echo "command=app:assembleDebug app:assembleRelease" >> "$GITHUB_OUTPUT";;
              *) echo "command=app:assembleRelease" >> "$GITHUB_OUTPUT";;
            esac
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew ${{ steps.gradle_command.outputs.command }} --stacktrace
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Prepare APKs for upload
        run: |
          mkdir -p flattened-apks
          find app/build/outputs/apk -name "*.apk" -exec cp {} flattened-apks/ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tailsocks-apks
          path: flattened-apks/*.apk

  release:
    name: Create Release
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: tailsocks-apks
          path: release-artifacts

      - name: Extract Release Notes from CHANGELOG
        id: changelog_reader
        run: |
          python3 -c "
          import re, os
          tag = os.environ.get('TAG_NAME', '')
          version = tag.lstrip('v')
          body = ''
          if os.path.exists('CHANGELOG.md'):
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              pattern = rf'(?s)(##\s*\[{re.escape(version)}\].*?)(?=\n##\s*\[|\Z)'
              match = re.search(pattern, content)
              if match:
                  section = match.group(1).strip()
                  lines = section.splitlines()
                  body = '\n'.join(lines[1:]).strip() if len(lines) > 1 else ''
          with open('release_notes.txt', 'w', encoding='utf-8') as out:
              out.write(body)
          "
        env:
          TAG_NAME: ${{ github.ref_name }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*.apk
          body_path: release_notes.txt
          tag_name: ${{ github.ref_name }}
          name: "TailSocks ${{ github.ref_name }}"
