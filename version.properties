# The version of the next release, the single place it is written.
#
# Bump both lines in the release commit, and tag it v<VERSION_NAME>: CI refuses
# a tag that disagrees. F-Droid reads the two lines from the tagged commit to
# find updates on its own (UpdateCheckData in its recipe), which a versionCode
# counted from git history never let it do.
#
# VERSION_CODE is major*1000000 + minor*10000 + patch*100. The last two digits
# stay free for per-ABI APKs; the old scheme (commit count + 502) ended near
# 1540, so every code here is an update over it.
VERSION_NAME=4.7.2
VERSION_CODE=4070200
