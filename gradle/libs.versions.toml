[versions]
agp = "8.13.2"
# Compose preview screenshot testing: renders @Preview functions on the build
# machine, so a layout can be checked in any geometry without a device.
screenshot = "0.0.1-alpha16"
# Window posture: where a foldable's hinge is, and whether it is half open.
material3-adaptive = "1.3.0"
kotlin = "2.2.21"
core-ktx = "1.17.0"
appcompat = "1.7.1"
material = "1.13.0"
gson = "2.10.1"
compose-bom = "2026.08.00"
# Material 3 Expressive proper: the components (LoadingIndicator, ButtonGroup,
# SplitButton, MaterialShapes) and MaterialTheme.motionScheme are not public in
# 1.4.0 — that artifact ships only their token classes. They arrive in 1.5.
material3 = "1.5.0-alpha27"
activity-compose = "1.8.2"
lifecycle-runtime-ktx = "2.7.0"
navigation = "2.9.6"
documentfile = "1.0.1"
browser = "1.10.0"
glance = "1.1.1"
ksp = "2.2.21-2.0.4"
appfunctions = "1.0.0-alpha10"
# QR codes to show (ui/QrCode.kt): Nayuki's encoder, MIT, plain Java with no
# dependencies and no reflection — nothing for R8 to keep, nothing non-free.
qrcodegen = "1.8.0"
# QR codes to scan (ui/QrScanActivity.kt): CameraX for the preview and the
# frames, ZXing's core to decode them. Both Apache-2.0 — no ML Kit, no Play
# services, nothing an F-Droid build cannot carry.
camerax = "1.6.2"
zxing = "3.5.4"
# Only for the compiler: CameraX's signatures name Guava's ListenableFuture, and
# AppFunctions' Guava on the runtime classpath swaps the standalone
# listenablefuture artifact for its empty stand-in. At run time the class comes
# with that Guava, the same version; the APK carries no second copy.
guava = "32.0.1-android"

[libraries]
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version = "1.7.3" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle-runtime-ktx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }
androidx-appfunctions = { group = "androidx.appfunctions", name = "appfunctions", version.ref = "appfunctions" }
androidx-appfunctions-compiler = { group = "androidx.appfunctions", name = "appfunctions-compiler", version.ref = "appfunctions" }
qrcodegen = { group = "io.nayuki", name = "qrcodegen", version.ref = "qrcodegen" }
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-compose = { group = "androidx.camera", name = "camera-compose", version.ref = "camerax" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }

androidx-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "material3-adaptive" }
screenshot-validation-api = { group = "com.android.tools.screenshot", name = "screenshot-validation-api", version.ref = "screenshot" }

[plugins]
screenshot = { id = "com.android.compose.screenshot", version.ref = "screenshot" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
