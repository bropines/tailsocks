# fdroiddata recipe for TailSocks, submitted on 2026-10-01 as
# https://gitlab.com/fdroid/fdroiddata/-/merge_requests/50707 — in the canonical,
# comment-free form `fdroid rewritemeta` makes of this file (fdroiddata's newer
# rewritemeta also wraps each `binary:` URL onto its own line). Its pipeline
# built all four ABIs of v4.5.3 and matched each to the release APK; on
# 2026-10-03 the MR moved to v4.6.1 (JDK 21, Go 1.27.1), verified the same way
# (fork pipeline 2909425971); 2026-10-05 it moved to v4.6.2 at the reviewer's
# request, and the same day to v4.7.0.
#
# Reproducible: F-Droid rebuilds each APK and, when it matches the GitHub
# release byte for byte, publishes ours with our signature. Proven on 2026-10-01
# for arm64 (commit 1c82d1c): F-Droid's build in the fork, with the signature of
# the GitHub CI build copied onto it, verified (`apksigcopier compare`). What
# that took: one APK for every channel (the updater is switched off at run time
# for store installs, not at build time), the Go core built in F-Droid's own
# path /home/vagrant/build/<appid> (gomobile records it), the pinned NDK for
# the core too, deterministic stamps (commit time, -buildvcs=false), and the C
# libraries built by Gradle with -ffile-prefix-map. See docs/DISTRIBUTION.md.
#
# One entry per ABI: VERSION_CODE + 1..4 (armeabi-v7a, arm64-v8a, x86, x86_64),
# TS_ABIS builds the core for that ABI alone, -PtargetAbi packages it alone.
#
# Precedents: com.tailscale.ipn (Go from the srclib, modules fetched in the
# build step), io.nekohasekai.sfa (gomobile, reproducible), hev.sockstun
# (hev-socks5-tunnel), com.luc4n3x.levyra (android-37.0). The buildserver's
# JDK 21 builds it: since 4.6.0 nothing asks for 17 (see app/build.gradle.kts).
#
# OPEN, the reviewer's call: NonFreeNet — the default coordination server and
# the admin console are Tailscale's service; a self-hosted Headscale replaces
# the former. com.tailscale.ipn does NOT carry it.

Categories:
  - Connectivity
  - VPN & Proxy
License: BSD-3-Clause
AuthorName: bropines
SourceCode: https://github.com/bropines/tailsocks
IssueTracker: https://github.com/bropines/tailsocks/issues
Translation: https://hosted.weblate.org/engage/tailsocks/
Changelog: https://github.com/bropines/tailsocks/blob/HEAD/CHANGELOG.md
Donate: https://boosty.to/pinus

AutoName: TailSocks

RepoType: git
Repo: https://github.com/bropines/tailsocks.git
AllowedAPKSigningKeys: 6be5bef7d0c51eb26863e6e5bb82b2980ae1e0fd0096c15524cf65a8bf9452cb

Builds:
  - versionName: 4.7.0
    versionCode: 4070001
    # The full hash of the v4.7.0 tag (fdroiddata wants no tag names here).
    commit: cabc1aad8200af528f4acc943d26237d8922c917
    subdir: app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y make patch curl
      # Bootstrap compiler for building Go from source (see GOROOT_BOOTSTRAP).
      - apt-get install -y -t trixie-backports golang-1.27-go
    # After the build commands (the Go core) Gradle assembles the APK.
    gradle:
      - yes
    binary: 
      https://github.com/bropines/tailsocks/releases/download/v%v/TailSocks-v%v-armeabi-v7a-release.apk
    output: build/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk
    srclibs:
      # Must equal the `go` line of appctr/go.mod; GOTOOLCHAIN=local below.
      - go@go1.27.1
    # compileSdk 37 is "android-37.0"; gomobile wants an android-<integer>
    # platform for its android.jar; AGP 8.13 builds with build-tools 35.
    prebuild:
      - sdkmanager 'platforms;android-37.0' 'platforms;android-36' 'build-tools;35.0.0'
      # hev-socks5-tunnel's Windows build ships wintun.dll; on Android its code
      # is under #if defined(__MSYS__). The scanner flags the DLL only as a
      # warning, which consults scanignore but never scandelete, so it goes here.
      - rm src/main/jni/hev-socks5-tunnel/third-part/wintun/bin/wintun.dll
    build:
      # Only the bootstrap compiler for the go srclib; the toolchain it builds
      # does not depend on it. golang-go in trixie-backports was left pointing
      # at the removed golang-1.26-go on 2026-10-04.
      - export GOROOT_BOOTSTRAP=/usr/lib/go-1.27
      - pushd $$go$$/src
      - ./make.bash
      - popd
      - export PATH=$$go$$/bin:$HOME/go/bin:$PATH
      - export GOTOOLCHAIN=local
      - export ANDROID_HOME=$$SDK$$
      - export ANDROID_NDK_HOME=$$NDK$$
      # Pinned to the golang.org/x/mobile version in appctr/go.mod, as CI does.
      - go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20251126181937-5c265dc024c4
      - go install golang.org/x/mobile/cmd/gobind@v0.0.0-20251126181937-5c265dc024c4
      # Downloads the Tailscale tag in appctr/TAILSCALE_VERSION, refuses it unless
      # it matches appctr/TAILSCALE_SHA256, applies the patches, builds the core.
      - cd ../appctr
      - TS_ABIS=armeabi-v7a bash build.sh
    # The same NDK as ndkVersion in app/build.gradle.kts and CI.
    ndk: 28.2.13676358
    gradleprops:
      - allowUnsignedRelease
      - targetAbi=armeabi-v7a

