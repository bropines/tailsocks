AutoUpdateMode: Version
UpdateCheckMode: Tags ^v\d+\.\d+\.\d+$
# Both lines are read from version.properties in the tagged commit.
UpdateCheckData: version.properties|VERSION_CODE=(\d+)|.|VERSION_NAME=([\d.]+)
VercodeOperation:
  - '%c + 1'
  - '%c + 2'
  - '%c + 3'
  - '%c + 4'
