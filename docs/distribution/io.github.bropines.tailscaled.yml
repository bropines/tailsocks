# fdroiddata recipe for TailSocks, to go to https://gitlab.com/fdroid/fdroiddata
# as metadata/io.github.bropines.tailscaled.yml. Written for v4.5.2, the first
# release that needs no workaround here; checked locally with the same Gradle
# properties (unsigned, no self-update, versionCode 4050200, versionName 4.5.2,
# no REQUEST_INSTALL_PACKAGES), not yet with `fdroid build`. `fdroid lint`
# passes; `fdroid rewritemeta` turns this into the canonical, comment-free
# form fdroiddata wants, which is what goes into the merge request.
#
# Modelled on recipes that build the same kinds of things:
#   com.tailscale.ipn    - the official Tailscale app: Go built from source
#                          (srclib), Go modules fetched in the build step.
#   io.nekohasekai.sfa   - sing-box: a gomobile .aar, Go from the `go` srclib.
#   hev.sockstun         - hev-socks5-tunnel via ndk-build, JDK 17 from bookworm.
#
# Markers: ASSUMPTION - believed true, not verified by running `fdroid build`;
#          OPEN - a reviewer's call or later work.

# The official Tailscale app carries Tracking for its debug-log upload; TailSocks
# compiles that out (ts_omit_logtail, TS_NO_LOGS_NO_SUPPORT=true), and this build
# has no update check at all (selfUpdate=false).
# OPEN: reviewer's call. The default coordination server and the admin console
# (api.tailscale.com) are Tailscale's proprietary service; a self-hosted Headscale
# replaces the former, nothing replaces the latter. com.tailscale.ipn does NOT
# carry NonFreeNet, which is the precedent to cite.
# AntiFeatures:
#   NonFreeNet:
#     en-US: Defaults to Tailscale's coordination server; the admin console works only with Tailscale's API.

Categories:
  - Connectivity
  - VPN & Proxy
License: BSD-3-Clause
AuthorName: bropines
SourceCode: https://github.com/bropines/tailsocks
IssueTracker: https://github.com/bropines/tailsocks/issues
Translation: https://hosted.weblate.org/engage/tailsocks/
Changelog: https://github.com/bropines/tailsocks/blob/HEAD/CHANGELOG.md
Donate: https://boosty.to/pinus

AutoName: TailSocks

RepoType: git
Repo: https://github.com/bropines/tailsocks.git

Builds:
  - versionName: 4.5.2
    versionCode: 4050200
    commit: v4.5.2
    subdir: app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y make patch curl
      # Bootstrap compiler for building Go from source, as com.tailscale.ipn does.
      # ASSUMPTION: trixie-backports' Go is new enough to bootstrap 1.26 (>= 1.24.6).
      - apt-get install -y -t trixie-backports golang-go
      # jvmToolchain(17) in app/build.gradle.kts; trixie ships 21. As hev.sockstun does.
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - update-java-alternatives -s java-1.17.0-openjdk-amd64
    gradleprops:
      # Package the release unsigned (F-Droid signs it) and without the GitHub
      # updater: no check, no download, no REQUEST_INSTALL_PACKAGES.
      - allowUnsignedRelease
      - selfUpdate=false
    output: build/outputs/apk/release/app-universal-release-unsigned.apk
    # ^ ABI splits share one versionCode, so this ships the universal APK (~85 MB).
    #   OPEN: per-ABI builds need per-ABI codes upstream; the scheme leaves the
    #   last two digits of VERSION_CODE free for them.
    srclibs:
      # Must equal the `go` line of appctr/go.mod and of Tailscale's go.mod.
      - go@go1.26.6
    prebuild:
      # compileSdk 37 is published as "platforms;android-37.0" (the first CI run
      # failed on "android-37"); the build image carries only build-tools 31,
      # and AGP 8.13 builds with 35.0.0. Same form as com.luc4n3x.levyra.
      - sdkmanager 'platforms;android-37.0' 'build-tools;35.0.0'
    build:
      - pushd $$go$$/src
      - ./make.bash
      - popd
      - export PATH=$$go$$/bin:$HOME/go/bin:$PATH
      # build.sh keeps a GOTOOLCHAIN it is given: nothing is downloaded.
      - export GOTOOLCHAIN=local
      - export ANDROID_HOME=$$SDK$$
      - export ANDROID_NDK_HOME=$$NDK$$
      # Pinned to the golang.org/x/mobile version in appctr/go.mod, as CI does.
      - go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20251126181937-5c265dc024c4
      - go install golang.org/x/mobile/cmd/gobind@v0.0.0-20251126181937-5c265dc024c4
      # Downloads the Tailscale tag in appctr/TAILSCALE_VERSION and refuses it unless
      # it matches appctr/TAILSCALE_SHA256; fetches Go modules (verified against
      # go.sum / sum.golang.org, anet pinned to appctr/go.mod), applies the patches,
      # builds libtailscale*.so for four ABIs and appctr.aar.
      # OPEN: a reviewer may prefer a `tailscale` srclib (git, tag v1.102.5) over
      # the download.
      - cd ../appctr
      - bash build.sh
    # The same NDK as ndkVersion in app/build.gradle.kts and CI.
    ndk: 28.2.13676358

# OPEN (reproducible builds): once F-Droid's build is shown to match ours, it can
# publish the author's APK with one signature for every channel. Needs release
# asset names without the commit hash for Binaries (only %v and %c expand), and
# the remaining differences listed in docs/DISTRIBUTION.md. Certificate SHA-256
# from the release APKs (apksigner verify --print-certs):
# Binaries: https://github.com/bropines/tailsocks/releases/download/v%v/TailSocks-v%v-universal-release.apk
# AllowedAPKSigningKeys: 6be5bef7d0c51eb26863e6e5bb82b2980ae1e0fd0096c15524cf65a8bf9452cb

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v\d+\.\d+\.\d+$
UpdateCheckData: version.properties|VERSION_CODE=(\d+)|.|VERSION_NAME=([\d.]+)
CurrentVersion: 4.5.2
CurrentVersionCode: 4050200
